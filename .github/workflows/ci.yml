name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck student
        run: npm run typecheck:student

      - name: Typecheck admin
        run: npm run typecheck:admin

      - name: Test admin
        run: npm run test:admin

      - name: Build student
        run: npm run build:student

      - name: Build admin
        run: npm run build:admin
